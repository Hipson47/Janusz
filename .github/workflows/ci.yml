name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
      timeout-minutes: 2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
      timeout-minutes: 2

    - name: Install dependencies
      run: uv sync --group dev --locked
      timeout-minutes: 3

    - name: Run developer quality gate
      run: make check
      timeout-minutes: 8

    - name: Run security gates
      if: matrix.python-version == '3.12'
      run: |
        uv run bandit -q -r src/janusz
        make security-audit
      timeout-minutes: 5

    - name: Run coverage gate
      if: matrix.python-version == '3.12'
      run: uv run pytest tests --cov=janusz --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      timeout-minutes: 6

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      timeout-minutes: 2

  release-candidate:
    name: Release Candidate Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group dev --locked

    - name: Run release gate
      run: make release-check
      timeout-minutes: 15
