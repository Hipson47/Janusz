[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janusz"
version = "1.0.0"
description = "Document-to-JSON and skill packaging pipeline for AI agent knowledge bases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = [
    "pdfplumber>=0.11.9",
    "pdfminer-six>=20251230",
    "pillow>=12.2.0",
    "cryptography>=46.0.7",
    "pyyaml>=6.0",
    "python-docx>=1.0.0",
    "lxml>=6.1.0",
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25.0",
    "pip>=26.1.1",
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=26.3.1",
    "mypy>=1.0.0",
    "pip-audit>=2.10.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "codecov>=2.1.0",
    "filelock>=3.20.3",
    "idna>=3.15",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "virtualenv>=20.36.1",
]
ai = [
    "httpx>=0.25.0",
]
rag = [
    "faiss-cpu>=1.7.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "filelock>=3.20.3",
    "idna>=3.15",
    "kubernetes>=36.0.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
prompts = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.5.0",
]
gui = [
    # tkinter is built-in on most systems, but some Linux distributions need it installed
    # Note: tkinter is part of python3-tk package on Ubuntu/Debian
]
nlp = [
    "spacy>=3.0.0",
    "nltk>=3.8.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/Hipson47/Janusz"
Repository = "https://github.com/Hipson47/Janusz"
Issues = "https://github.com/Hipson47/Janusz/issues"

[project.scripts]
janusz = "janusz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

# Allow gradual adoption
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
# Third-party libraries without type stubs
module = [
    "yaml",
    "pdfplumber.*",
    "docx.*",
    "bs4.*",
    "html2text.*",
    "nltk.*",
    "spacy.*",
    "PIL.*",
    "fitz.*",
    "faiss",
    "numpy",
    "chromadb",
    "chromadb.*",
    "sentence_transformers",
    "pyperclip"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Production 1.0 focuses strict typing on the core CLI, packaging, memory,
# registry, plugin, and MCP surface. Legacy optional modules remain available
# but are not part of the 1.0 type gate until they are separately hardened.
module = [
    "janusz.gui.*",
    "janusz.orchestrator.*",
    "janusz.prompts.*",
    "janusz.rag.*",
    "janusz.schemas.*"
]
ignore_errors = true

[[tool.mypy.overrides]]
# Generated code and build artifacts
module = [
    "src.*",
    "tests.*",
    "setup",
    "distutils.*",
    "pkg_resources"
]
ignore_errors = false

[[tool.mypy.overrides]]
# Test files can be less strict
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = false

[[tool.mypy.overrides]]
# Example scripts are not part of main codebase
module = "examples.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]  # Skip assert checks and shell usage in subprocess

[dependency-groups]
dev = [
    "httpx>=0.25.0",
    "pip>=26.1.1",
    "pip-audit>=2.7.3",
]
